name: Build Netfive Category Feed
on:
  schedule:
    - cron: "17 6 * * *"   # diário, 03:17 BRT
  workflow_dispatch:
    inputs:
      scan_budget_minutes:
        description: "Tempo máximo da varredura de jogos (minutos)"
        required: false
        default: "150"
  push:
    branches: [main]
    paths: ["config/**", "scripts/**"]
# Nothing can write by default; only the publish job gets contents: write
permissions:
  contents: read
concurrency:
  group: build-feed
  cancel-in-progress: false
jobs:
  build:
    # Runs the scripts that download third-party lists and web pages: read-only token
    runs-on: ubuntu-latest
    timeout-minutes: 300
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml==6.0.2
      - name: Build feed (listas + varredura proativa de jogos)
        env:
          # Opcional: categorias da Cloudflare (Intel API). Sem os secrets, a varredura usa só o conteúdo.
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          SCAN_BUDGET_MINUTES: ${{ github.event.inputs.scan_budget_minutes || '150' }}
        run: python scripts/build_feed.py
      - name: Sanity check (ranking de popularidade obrigatório)
        run: |
          python -c "import json,sys;f=json.load(open('dist/feed.json'));sys.exit(0 if f['popularity_ranking'] else 'Tranco indisponivel - feed nao publicado')"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: feed
          path: |
            dist/
            state/
          retention-days: 7

  publish:
    # Only commits the files built above: no third-party code runs with the write token
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: feed
      - name: Commit feed
        run: |
          git config user.name "netfive-feed-bot"
          git config user.email "feed-bot@users.noreply.github.com"
          git add dist/ state/
          git diff --cached --quiet || git commit -m "feed: $(jq -r .version dist/manifest.json)"
          git pull --rebase --autostash
          git push
