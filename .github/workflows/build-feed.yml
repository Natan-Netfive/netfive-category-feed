name: Build Netfive Category Feed
on:
  schedule:
    - cron: "17 6 * * *"   # diário, 03:17 BRT
  workflow_dispatch:
    inputs:
      scan_budget_minutes:
        description: "Tempo máximo da varredura de jogos (minutos)"
        required: false
        default: "150"
  push:
    paths: ["config/**", "scripts/**"]
permissions:
  contents: write
concurrency:
  group: build-feed
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: Build feed (listas + varredura proativa de jogos)
        env:
          # Opcional: categorias da Cloudflare (Intel API). Sem os secrets, a varredura usa só o conteúdo.
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          SCAN_BUDGET_MINUTES: ${{ github.event.inputs.scan_budget_minutes || '150' }}
        run: python scripts/build_feed.py
      - name: Sanity check (ranking de popularidade obrigatório)
        run: |
          python -c "import json,sys;f=json.load(open('dist/feed.json'));sys.exit(0 if f['popularity_ranking'] else 'Tranco indisponivel - feed nao publicado')"
      - name: Commit feed
        run: |
          git config user.name "netfive-feed-bot"
          git config user.email "feed-bot@users.noreply.github.com"
          git add dist/ state/
          git diff --cached --quiet || git commit -m "feed: $(jq -r .version dist/manifest.json)"
          git pull --rebase --autostash
          git push
