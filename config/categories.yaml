# Netfive Category Feed — mapeamento de categorias do app Netfive Web Filtering
# Cada categoria combina: fontes externas (listas abertas) + curadoria Netfive (seção curated abaixo).
# A curadoria Netfive SEMPRE entra no feed (prioridade máxima), antes de qualquer corte por tamanho.

defaults:
  max_domains: 400          # teto por categoria (ajustar após validar o limite de FQDN por regra no Falcon)
  add_wildcard: true        # gera também *.dominio (mesmo comportamento do app v1.1)
  popularity_top: 1000000   # usar apenas domínios presentes no Tranco Top N (quando disponível)

sources:
  ut1: "https://raw.githubusercontent.com/olbat/ut1-blacklists/master/blacklists/{list}/domains"
  hagezi: "https://raw.githubusercontent.com/hagezi/dns-blocklists/main/wildcard/{list}-onlydomains.txt"
  tranco: "https://tranco-list.eu/top-1m.csv.zip"

categories:
  Adulto:
    ut1: [mixed_adult]
    hagezi: [nsfw]
  Apostas:
    ut1: [gambling]
    hagezi: [gambling]
    wildcards: ["bet.br"]          # domínio usado pelas bets autorizadas no Brasil
  Games:
    curated_only: true             # plataformas/lojas de games (Steam, Epic, Riot...)
  Jogos:
    ut1: [games]                   # jogos online / browser games
  IA_Generativa:
    ut1: [ai]
  Proxy_VPN_Anonimizador:
    ut1: [vpn, residential-proxies]
  Redes_Sociais:
    ut1: [social_networks]
  Streaming:
    ut1: [audio-video, radio]
  Torrent_Pirataria:
    ut1: [warez]
    hagezi: [anti.piracy]


