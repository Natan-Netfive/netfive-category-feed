# Netfive Category Feed — mapeamento de categorias do app Netfive Web Filtering
# Cada categoria combina: fontes externas (listas abertas) + curadoria Netfive (seção curated abaixo).
# A curadoria Netfive SEMPRE entra no feed (prioridade máxima), antes de qualquer corte por tamanho.

defaults:
  max_domains: 400          # teto por categoria (ajustar após validar o limite de FQDN por regra no Falcon)
  add_wildcard: true        # gera também *.dominio (mesmo comportamento do app v1.1)
  popularity_top: 1000000   # usar apenas domínios presentes no Tranco Top N (quando disponível)

sources:
  ut1: "https://raw.githubusercontent.com/olbat/ut1-blacklists/master/blacklists/{list}/domains"
  hagezi: "https://raw.githubusercontent.com/hagezi/dns-blocklists/main/wildcard/{list}-onlydomains.txt"
  tranco: "https://tranco-list.eu/top-1m.csv.zip"

categories:
  Adulto:
    ut1: [mixed_adult]
    hagezi: [nsfw]
    max_domains: 3000
  Apostas:
    ut1: [gambling]
    hagezi: [gambling]
    wildcards: ["bet.br"]          # domínio usado pelas bets autorizadas no Brasil
    max_domains: 2000
  Games:
    curated_only: true             # plataformas/lojas de games (Steam, Epic, Riot...)
  Jogos:
    ut1: [games]                   # jogos online / browser games
    # 3000 cortava a UT1 no rank Tranco ~265 mil (ev.io, 2048game.com... ficavam de fora).
    # 8000 = curadoria + varredura + toda a UT1 presente no Tranco Top 1M (~6000).
    # ~16000 FQDNs (com *.dominio) = ~11 regras de 1500: VALIDAR NO LAB antes de liberar a clientes.
    max_domains: 8000              # app v2.2+ divide a categoria em varias regras
    scan:                          # varredura proativa (scripts/game_scan.py), sem depender de telemetria
      enabled: true
      cache: scan_Jogos.json       # state/scan_Jogos.json, versionado pelo bot
      budget_minutes: 150          # tempo máximo de varredura por execução (o job tem 300 min)
      workers: 48                  # downloads em paralelo
      ttl_days: 30                 # reanalisa um domínio depois de 30 dias
      error_ttl_days: 7            # sites fora do ar: tenta de novo em 7 dias
      cloudflare_top: 200000       # Cloudflare também olha o Top 200k que nenhuma lista cobre
      cloudflare_budget: 6000      # consultas à Cloudflare por execução (CF_BUDGET sobrepõe)
  IA_Generativa:
    ut1: [ai]
  Proxy_VPN_Anonimizador:
    ut1: [vpn, residential-proxies]
  Redes_Sociais:
    ut1: [social_networks]
  Streaming:
    ut1: [audio-video, radio]
  Torrent_Pirataria:
    ut1: [warez]
    hagezi: [anti.piracy]
    max_domains: 1500


